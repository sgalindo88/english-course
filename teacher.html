<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluentPath · Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/teacher-portal.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Fluent<span class="accent">Path</span></h1>
    <p class="subtitle">Teacher Portal</p>
    <div class="divider"></div>
    <div class="role-badge">Instructor Access</div>
  </div>

  <!-- Login — shown until a teacher session exists -->
  <div id="loginView" style="display:none;">
    <div class="section-label">SIGN IN</div>
    <div class="auth-box">
      <input type="email" id="tEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="tPassword" placeholder="Password" autocomplete="current-password">
      <p id="tLoginError" class="auth-msg err" style="display:none;"></p>
      <button id="tLoginBtn" onclick="teacherLogin()">Log In</button>
    </div>
  </div>

  <!-- Portal — shown once authenticated as a teacher -->
  <div id="portalView" style="display:none;">
    <div class="section-label">
      SELECT A STUDENT
      <a href="#" onclick="teacherLogout();return false;" style="float:right;font-weight:400;font-size:12px;">Log out</a>
    </div>
    <div id="studentList" class="student-list">
      <div class="loading-msg">Loading students&hellip;</div>
    </div>

    <div class="section-label" style="margin-top:28px;">CREATE STUDENT ACCOUNT</div>
    <div class="auth-box">
      <input type="text" id="caName" placeholder="Student name (used as the data key)">
      <input type="email" id="caEmail" placeholder="Student email (used to log in)">
      <input type="password" id="caPassword" placeholder="Initial password">
      <p id="caStatus" class="auth-msg" style="display:none;"></p>
      <button id="caBtn" onclick="createStudentAccount()">Create Account</button>
    </div>
  </div>

  <div class="footer">
    <p>A <a href="#">Fluentora</a> programme</p>
  </div>
</div>

<style>
  .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .auth-box input { padding: 12px 14px; font-size: 15px; border: 1px solid var(--rule, #d8cfc0); border-radius: 6px; font-family: inherit; }
  .auth-box button { padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; border-radius: 6px; background: var(--ink, #1a1208); color: #fff; }
  .auth-msg { font-size: 13px; margin: 0; }
  .auth-msg.err { color: #b8471e; }
  .auth-msg.ok { color: #2e6e45; }
</style>

<script src="src/scripts/config.js"></script>
<script src="src/scripts/api.js"></script>
<script src="src/scripts/utils.js"></script>
<script src="src/scripts/teacher-portal.js"></script>

</body>
</html>
