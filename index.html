<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluentPath · Coming Soon</title>
<meta name="description" content="FluentPath — your journey to English fluency. Something new is on the way.">

<!-- Open Graph / social preview -->
<meta property="og:title" content="FluentPath · Coming Soon">
<meta property="og:description" content="Your journey to fluency starts here. Something new is on the way.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1a1208;
    --paper:#f5f0e8;
    --cream:#ede8dc;
    --rust:#b8471e;
    --gold:#c9933a;
    --rule:#c8bfa8;
    --muted:#5a5040;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    font-family:'Source Serif 4',Georgia,serif;
    font-weight:300;
    line-height:1.7;
    color:var(--ink);
    background:var(--paper);
    background-image:
      radial-gradient(circle at 18% 22%, rgba(201,147,58,0.10), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(184,71,30,0.08), transparent 45%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    position:relative;
    overflow:hidden;
  }

  /* subtle paper grain corners */
  body::before,
  body::after{
    content:"";
    position:absolute;
    width:280px;height:280px;
    border:1px solid var(--rule);
    opacity:.35;
    pointer-events:none;
  }
  body::before{top:-90px;left:-90px;border-radius:0 0 100% 0;}
  body::after{bottom:-90px;right:-90px;border-radius:100% 0 0 0;}

  .wrap{
    max-width:560px;
    width:100%;
    text-align:center;
    position:relative;
    z-index:1;
  }

  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15;}

  .eyebrow{
    font-family:'Playfair Display',Georgia,serif;
    font-style:italic;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--rust);
    margin-bottom:22px;
  }

  .logo{
    font-size:clamp(48px,11vw,82px);
    margin-bottom:14px;
  }
  .logo .accent{color:var(--rust);font-style:italic;}

  .tagline{
    color:var(--muted);
    font-style:italic;
    font-size:clamp(17px,2.6vw,20px);
    max-width:420px;
    margin:0 auto;
  }

  .divider{
    width:64px;height:2px;
    background:var(--gold);
    margin:30px auto;
  }

  .headline{
    font-size:clamp(24px,4.4vw,34px);
    margin-bottom:14px;
  }
  .headline em{color:var(--rust);}

  .blurb{
    color:var(--muted);
    font-size:16px;
    max-width:440px;
    margin:0 auto;
  }

  .footer{
    margin-top:54px;
    color:var(--muted);
    font-size:14px;
  }
  .footer a{color:var(--rust);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s;}
  .footer a:hover{border-color:var(--rust);}

  @media (max-width:480px){
    body::before,body::after{width:180px;height:180px;}
  }
</style>
</head>
<body>

  <main class="wrap">
    <p class="eyebrow">Something new is on the way</p>

    <h1 class="logo">Fluent<span class="accent">Path</span></h1>
    <p class="tagline">Your journey to fluency starts here.</p>

    <div class="divider"></div>

    <h2 class="headline">We're building something <em>better</em>.</h2>
    <p class="blurb">
      A warmer, simpler way to learn English — personalised lessons,
      real progress, and a teacher in your corner. Check back soon.
    </p>

    <div class="footer">
      <p>A <a href="#">Fluentora</a> programme &middot; &copy; <span id="year"></span></p>
    </div>
  </main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
